name: Reconcile durable RouteTill purchases
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: read
concurrency:
  group: routetill-reconciliation
  cancel-in-progress: false
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    strategy:
      fail-fast: false
      matrix:
        environment: [production, demo]
    environment: ${{ matrix.environment }}
    env:
      APP_ORIGIN: ${{ vars.APP_ORIGIN }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Wake the authenticated database-backed worker
        shell: bash
        run: |
          if [[ -z "$APP_ORIGIN" || -z "$CRON_SECRET" ]]; then
            echo 'Configure APP_ORIGIN and CRON_SECRET in this GitHub environment.'
            exit 1
          fi
          if [[ "$APP_ORIGIN" != https://* ]]; then
            echo 'The reconciliation origin must use HTTPS.'
            exit 1
          fi
          curl --silent --show-error --fail --max-time 55 \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_ORIGIN%/}/api/cron/reconcile"
